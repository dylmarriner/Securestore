name: securestore

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: securestore
      POSTGRES_PASSWORD: securestore
      POSTGRES_DB: securestore
    volumes:
      - securestore_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securestore"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["node", "dist/db/migrate.js"]
    environment:
      DATABASE_URL: postgres://securestore:securestore@postgres:5432/securestore
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: creates the first org/workspace/admin-user/admin-agent and
  # prints the admin API key to logs. Run once (`docker compose run seed`),
  # then remove/ignore for subsequent `docker compose up`.
  seed:
    build: .
    command: ["node", "dist/scripts/seed.js"]
    environment:
      DATABASE_URL: postgres://securestore:securestore@postgres:5432/securestore
      SECURESTORE_MASTER_KEY: ${SECURESTORE_MASTER_KEY:?set via .env, generate with: openssl rand -base64 32}
      SECURESTORE_FINGERPRINT_PEPPER: ${SECURESTORE_FINGERPRINT_PEPPER:?set via .env, generate with: openssl rand -base64 32}
      SECURESTORE_APIKEY_PEPPER: ${SECURESTORE_APIKEY_PEPPER:?set via .env, generate with: openssl rand -base64 32}
    profiles: ["seed"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      DATABASE_URL: postgres://securestore:securestore@postgres:5432/securestore
      PORT: "8443"
      HOST: "0.0.0.0"
      SECURESTORE_MASTER_KEY: ${SECURESTORE_MASTER_KEY:?set via .env, generate with: openssl rand -base64 32}
      SECURESTORE_FINGERPRINT_PEPPER: ${SECURESTORE_FINGERPRINT_PEPPER:?set via .env, generate with: openssl rand -base64 32}
      SECURESTORE_APIKEY_PEPPER: ${SECURESTORE_APIKEY_PEPPER:?set via .env, generate with: openssl rand -base64 32}
      SECURESTORE_ADMIN_BOOTSTRAP_TOKEN: ${SECURESTORE_ADMIN_BOOTSTRAP_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    # Scale horizontally: `docker compose up --scale app=3` and put a
    # session-affinity-aware load balancer in front (see src/mcp/httpServer.ts).
    deploy:
      replicas: 1

volumes:
  securestore_pgdata:
